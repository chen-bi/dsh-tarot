<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="dsh-tarot · 命运牌桌">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a1c"/>
      <stop offset="0.55" stop-color="#171030"/>
      <stop offset="1" stop-color="#0a1226"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#d9b36a" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#7b5cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0a0a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dfa8"/>
      <stop offset="0.5" stop-color="#d9b36a"/>
      <stop offset="1" stop-color="#a8813c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f2e6"/>
      <stop offset="1" stop-color="#ded3bb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <path d="M0 300 L1200 300" stroke-opacity="0.05"/>
    <path d="M0 340 L1200 340" stroke-opacity="0.04"/>
  </g>

  <g fill="#f6dfa8" opacity="0.75">
    <circle cx="120" cy="70" r="1.6"/><circle cx="300" cy="45" r="1.2"/><circle cx="470" cy="96" r="1.4"/>
    <circle cx="700" cy="52" r="1.2"/><circle cx="880" cy="88" r="1.6"/><circle cx="1080" cy="60" r="1.3"/>
    <circle cx="980" cy="150" r="1"/><circle cx="210" cy="160" r="1"/><circle cx="620" cy="130" r="1.1"/>
    <circle cx="1150" cy="200" r="1.2"/><circle cx="60" cy="230" r="1.1"/><circle cx="790" cy="30" r="1"/>
  </g>

  <!-- 月牙 -->
  <g transform="translate(1010 120)">
    <circle r="52" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.55"/>
    <path d="M14 -34 A40 40 0 1 1 14 34 A30 30 0 1 0 14 -34 Z" fill="#f6dfa8" opacity="0.5"/>
  </g>

  <!-- 扇形三张牌 -->
  <g transform="translate(760 300)">
    <g transform="rotate(-18) translate(-150 -190)">
      <rect width="150" height="230" rx="10" fill="url(#card)" stroke="url(#gold)" stroke-width="2"/>
      <rect x="9" y="9" width="132" height="212" rx="6" fill="none" stroke="#8a6a2f" stroke-opacity="0.5"/>
      <text x="75" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#5c4519">✦</text>
    </g>
    <g transform="rotate(18) translate(0 -190)">
      <rect width="150" height="230" rx="10" fill="url(#card)" stroke="url(#gold)" stroke-width="2"/>
      <rect x="9" y="9" width="132" height="212" rx="6" fill="none" stroke="#8a6a2f" stroke-opacity="0.5"/>
      <text x="75" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#5c4519">✧</text>
    </g>
    <g transform="translate(-75 -200)">
      <rect width="150" height="230" rx="10" fill="#12101f" stroke="url(#gold)" stroke-width="2.4"/>
      <rect x="10" y="10" width="130" height="210" rx="6" fill="none" stroke="#d9b36a" stroke-opacity="0.45"/>
      <g stroke="url(#gold)" stroke-width="1.6" fill="none" opacity="0.9">
        <circle cx="75" cy="115" r="34"/>
        <path d="M75 55 L75 175 M35 115 L115 115 M47 87 L103 143 M103 87 L47 143"/>
        <circle cx="75" cy="115" r="12"/>
      </g>
    </g>
  </g>

  <text x="80" y="150" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#d9b36a" letter-spacing="10">DSH PLUGIN</text>
  <text x="76" y="232" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="72" font-weight="700" fill="#f7f2e6">命运牌桌</text>
  <text x="80" y="278" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#a49bc4" letter-spacing="1.5">tarot · 78 张韦特牌 · 6 种牌阵 · 侧边栏常驻 · 自动存档</text>
  <text x="80" y="320" font-family="Consolas, monospace" font-size="18" fill="#7f76a3">你在聊天里报数字，牌桌翻开，助手逐张解牌。</text>

  <g transform="translate(80 352)" opacity="0.9">
    <circle cx="4" cy="0" r="4" fill="#58c47a"/>
    <text x="16" y="6" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#8f87ae">dsh-tarot · DeepSeek Harness plugin</text>
  </g>
</svg>
